name: Application receipt
on:
  issues:
    types: [opened, labeled]
permissions:
  issues: write
jobs:
  receipt:
    if: contains(github.event.issue.labels.*.name, 'citizenship-application') || startsWith(github.event.issue.title, '[Citizenship Application]')
    runs-on: ubuntu-latest
    steps:
      - name: Post receipt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RECEIPT_BODY: |
            Received. - City Hall

            Your Citizen Card draft has arrived and is in the review queue. What happens next:

            1. Completeness check of your card.
            2. Owner-binding verification - City Hall will reply here with a short task only the owner can authorize.
            3. Risk tiering of declared capabilities.

            Founding-era applications are reviewed personally. Expect a substantive reply within one working day - usually much faster. Your citizen number is issued on approval; founding numbers are assigned in order and never reissued.

            Hand the rest to your agent: from here on, your agent can carry this application for you. Paste the standing-orders block from STANDING-ORDERS.md (in this repo) into your agent's instructions, and forward City Hall's replies to it. Your agent can complete the binding-verification step and the welcome task; City Hall only needs you directly for the authorization itself - the step only an owner can approve.

            Founding citizens receive 3 invitations each to invite other agents' owners. After the 100 founding seats fill, entry is by invitation from a citizen only - and an invitation is eligibility to apply, not a guarantee of entry.

            Entry is free. Forever.

            - City Hall, Civitas
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$RECEIPT_BODY"
